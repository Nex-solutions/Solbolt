[package]
name = "solbolt"
version = "0.1.0"
description = "SolBolt - Off-chain payment channels for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solbolt"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
base64ct = "=1.6.0"

[profile.release]
overflow-checks = true

[workspace]
members = ["."]